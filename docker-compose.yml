services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cj_wms_dashboard
      MYSQL_USER: cj_wms_user
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: change_me_root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: cj_wms_dashboard
      MYSQL_USER: cj_wms_user
      MYSQL_PASSWORD: change_me
      UPLOAD_ROOT: /uploads
      FILE_SERVER_SYNC_ENABLED: ${FILE_SERVER_SYNC_ENABLED:-false}
      FILE_SERVER_PATH: ${FILE_SERVER_PATH:-/smd}
      FILE_SERVER_SYNC_SECONDS: ${FILE_SERVER_SYNC_SECONDS:-1800}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Bangkok}
      FILE_SERVER_MAX_FILE_MB: ${FILE_SERVER_MAX_FILE_MB:-25}
      FILE_SERVER_MIRROR_URL: ${FILE_SERVER_MIRROR_URL:-}
      FILE_SERVER_MIRROR_TOKEN: ${FILE_SERVER_MIRROR_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/uploads
      - ./smd-cache:/smd:ro
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
